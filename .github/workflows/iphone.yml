name: Prueba en iPhone real (simulador de Apple)
on:
  push:
    branches: [ccr-0fad2201-t2nf7s]
  workflow_dispatch:
    inputs:
      url:
        description: Enlace del menú
        default: https://menusazonpro.pages.dev/m/amikumo/
permissions:
  contents: write
jobs:
  iphone:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Elegir y encender un iPhone
        run: |
          xcrun simctl list devices available | grep -i iphone | head -8
          UDID=$(xcrun simctl list devices available -j | node -e "const d=JSON.parse(require('fs').readFileSync(0));const runs=Object.keys(d.devices).filter(k=>/iOS/.test(k)).sort();const r=runs[runs.length-1];const dev=d.devices[r].filter(x=>/iPhone 1[3-6]( Pro)?$/.test(x.name))[0]||d.devices[r].filter(x=>/iPhone/.test(x.name))[0];console.log(dev.udid)")
          echo "UDID=$UDID" >> $GITHUB_ENV
          xcrun simctl boot $UDID || true
          xcrun simctl bootstatus $UDID -b
          xcrun simctl list devices | grep $UDID
      - name: Instalar Appium
        run: |
          node --version
          npm install -g appium@latest 2>&1 | tail -5
          npm ls -g --depth=0
          ls -la $(dirname $(which node)) | grep -i appium || true
          appium --version; echo "appium --version salió con $?"
          appium driver install xcuitest 2>&1 | tail -15
          appium driver list --installed; echo "driver list salió con $?"
      - name: Arrancar Appium
        run: |
          set -x
          nohup appium --address 127.0.0.1 --port 4723 --log-level info > appium.log 2>&1 &
          sleep 15; cat appium.log | tail -30
          for i in $(seq 1 20); do curl -s http://127.0.0.1:4723/status && break; sleep 3; done
          curl -s http://127.0.0.1:4723/status || (echo "APPIUM NO ARRANCÓ"; tail -50 appium.log; exit 1)
      - name: Hacer el pedido en el iPhone
        env:
          URL_MENU: ${{ github.event.inputs.url || 'https://menusazonpro.pages.dev/m/amikumo/' }}
        run: node iphone-flow.js 2>&1 | tee resultado.txt
      - name: Guardar capturas
        if: always()
        run: |
          tail -120 appium.log > appium-final.log 2>/dev/null || true
          rm -rf /tmp/out && mkdir -p /tmp/out
          cp -r capturas /tmp/out/ 2>/dev/null || true
          cp resultado.txt appium-final.log /tmp/out/ 2>/dev/null || true
          cd /tmp/out && git init -q && git checkout -q -b capturas-${{ github.run_number }}
          git add -A && git -c user.name=prueba-iphone -c user.email=bot@example.com commit -qm "capturas de la corrida ${{ github.run_number }}" || true
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git push -f origin capturas-${{ github.run_number }} || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: |
            capturas
            resultado.txt
